[project]
name = "semotion"
version = "0.1.0"
description = "Semantic Motion — semantic-driven motion graphics for talking-head video"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pillow>=11", "opencv-python-headless>=4.10"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
